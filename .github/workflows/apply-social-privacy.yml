name: Apply social privacy features

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply patch
        run: node scripts/apply-social-privacy.mjs

      - name: Build test
        run: |
          npm install
          npm run build

      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-vitae.jsx scripts/apply-social-privacy.mjs
          git commit -m "feat: unique usernames private profiles and feed photos"
          git push
