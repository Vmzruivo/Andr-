name: Apply social privacy features

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply patch
        run: node scripts/apply-social-privacy.mjs

      - name: Normalize existing patch scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/patch-missions.mjs")
          s = p.read_text()
          s = s.replace("size={15/>", "size={15}/>")
          p.write_text(s)

          p = Path("scripts/patch-social.mjs")
          s = p.read_text()
          old = "else if(!s.includes('updatePost, deletePost, getComments')) throw new Error('Import social não encontrado');"
          new = "else if(s.includes('updatePost, deletePost')) s=s.replace('updatePost, deletePost, subscribeToFeed','updatePost, deletePost, getComments, addComment, subscribeToComments, subscribeToFeed'); else throw new Error('Import social não encontrado');"
          s = s.replace(old, new)
          marker = "fs.writeFileSync(file,s);"
          if "cv-post-photo-tools" not in s:
              inject = '''if(!s.includes('cv-post-photo-tools')){\n  s=s.replace('<textarea placeholder="Compartilhe sua conquista ou progresso…" value={postText}', '<div className="cv-post-photo-tools"><label className="cv-photo-button"><ImageIcon size={18}/> Adicionar foto<input type="file" accept="image/*" onChange={uploadPostImage} hidden/></label>{postImage&&<button type="button" className="cv-photo-clear" onClick={()=>setPostImage(null)}>Remover foto</button>}</div><textarea placeholder="Compartilhe sua conquista ou progresso…" value={postText}');\n  s=s.replace('<p className="cv-post-text">{p.text}</p>', '{p.image_url&&<img className="cv-post-image" src={p.image_url} alt="Foto da publicação" loading="lazy"/>}<p className="cv-post-text">{p.text}</p>');\n}\n'''
              s = s.replace(marker, inject + marker)
          s = s.replace('const author=p.profiles||effectiveProfile;', 'const author=p.profiles||{name:"Perfil privado",avatar_url:null,equipped_title:null};')
          s = s.replace('const ca=c.profiles||effectiveProfile;', 'const ca=c.profiles||{name:"Perfil privado",avatar_url:null,equipped_title:null};')
          s = s.replace('const addPost=async()=>{if(!postText.trim())return;try{const p=await publishPost({authorId:session.user.id,text:postText});setPosts(xs=>[p,...xs]);setPostText("")}', 'const addPost=async()=>{if(!postText.trim()&&!postImage)return;try{const p=await publishPost({authorId:session.user.id,text:postText,imageUrl:postImage});setPosts(xs=>[p,...xs]);setPostText("");setPostImage(null)}')
          p.write_text(s)

          p = Path("scripts/patch-settings.mjs")
          s = p.read_text()
          needle = '<div className="cv-settings-section"><h3>🔐 Privacidade</h3><div className="cv-privacy-note">'
          replacement = '<div className="cv-settings-section"><h3>🔐 Privacidade</h3><div className="cv-privacy-note"><label className="cv-private-toggle"><input type="checkbox" checked={!!effectiveProfile.is_private} onChange={togglePrivacy}/><span>Deixar meu perfil particular</span></label>'
          s = s.replace(needle, replacement)
          if '.cv-private-toggle' not in s:
              css_marker = 'if(!s.includes(\'.cv-settings-page{\')){'
              css_insert = '''if(!s.includes('.cv-private-toggle')){\n const extraCss=` .cv-private-toggle{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:800}.cv-private-toggle input{width:18px;height:18px;accent-color:${GOLD}}\\n`;\n s=s.replace(css_marker,extraCss+css_marker);\n}\n'''
              s = s.replace(css_marker, css_insert + css_marker)
          p.write_text(s)
          PY

      - name: Build test
        run: |
          npm install
          npm run build

      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-vitae.jsx scripts/apply-social-privacy.mjs scripts/patch-missions.mjs scripts/patch-social.mjs scripts/patch-settings.mjs
          git commit -m "feat: unique usernames private profiles and feed photos"
          git push
