name: Deploy Codex Vitae

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://kpfezbmtmxczpdvqogje.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # The repository currently contains a minimal lockfile that is not a
      # complete npm v3 lock tree. npm ci intentionally refuses to repair such
      # a lockfile, so it was the reason the deploy stopped during install.
      # npm install is allowed to reconcile package.json/package-lock.json and
      # create the complete dependency tree needed by this CI run.
      - name: Install and reconcile dependencies
        run: npm install --no-audit --no-fund

      - name: Verify dependency tree
        run: npm ls --depth=0

      - name: Run build health check
        run: npm run build:check

      - name: Check Supabase configuration
        env:
          KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$KEY" ] && [ -z "$ANON" ]; then
            echo "::warning::Supabase publishable/anon key secret is missing. The static site will still be built, but authentication/data access will not work until the secret is configured."
          else
            echo "Supabase configuration secret detected."
          fi

      - name: Build static site
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -s dist/index.html
          test -d dist/assets

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
