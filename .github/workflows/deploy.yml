name: Deploy Codex Vitae

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Public Supabase client values are intentionally available to the browser build.
  # Supabase publishable keys are safe to expose when RLS is correctly configured.
  VITE_SUPABASE_URL: https://kpfezbmtmxczpdvqogje.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_oD41poIileZVeuzUV7qspg_eIOE89wT

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Deploy the finalized social/privacy build after the automated patch commit.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
